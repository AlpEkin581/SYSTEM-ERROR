<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL_DESTRUCT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="matrix-bg"></div> <div id="desktop">
        <div class="icons-container">
            <button class="main-button" onclick="openFolder()">
                <span class="icon-img">📁</span>
                <span class="icon-text">NOTLAR.TXT</span>
            </button>
            
            <button class="main-button" onclick="openTerminal()">
                <span class="icon-img">📟</span>
                <span class="icon-text">TERMINAL</span>
            </button>
            
            <button class="main-button" onclick="startFinal()">
                <span class="icon-img">⚠️</span>
                <span class="icon-text">SISTEM.EXE</span>
            </button>
        </div>

        <div id="msg-box" class="hidden window">
            <div class="header">[SYSTEM_ALERT]</div>
            <div class="content">
                <p id="msg-text"></p>
                <button class="exe-btn" onclick="closeBox('msg-box')">> DEVAM_ET</button>
            </div>
        </div>

        <div id="loading-box" class="hidden window">
            <div class="header">[DECRYPTING_DATA]</div>
            <div class="content">
                <div class="progress-bg"><div id="bar"></div></div>
            </div>
        </div>

        <div id="terminal-window" class="hidden window">
            <div class="header">[ROOT_ACCESS]</div>
            <div class="content">
                <input type="text" id="code-input" placeholder="GIRIS_KODU..." autocomplete="off">
                <button class="exe-btn" onclick="checkCode()">> EXECUTE</button>
                <div id="output"></div>
                <button class="close-btn" onclick="closeBox('terminal-window')">[KAPAT]</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
