<div id="desktop">
    <div class="icons-container">
        <div class="icon" onclick="openFolder()">
            <span>📁</span>
            <p>Notlar.txt</p>
        </div>
        <div class="icon" onclick="openTerminal()">
            <span>📟</span>
            <p>Terminal</p>
        </div>
        <div class="icon" onclick="startFinal()">
            <span>⚠️</span>
            <p>SİSTEM.exe</p>
        </div>
    </div>

    <div id="loading-box" class="hidden">
        <div class="title-bar">TARANIYOR...</div>
        <div id="progress-bar-bg"><div id="progress-bar"></div></div>
    </div>

    <div id="terminal-window" class="hidden">
        <div class="title-bar">TERMİNAL</div>
        <div class="content">
            <input type="text" id="access-code" placeholder="Kod...">
            <button onclick="checkCode()">GİR</button>
            <div id="terminal-output"></div>
            <button class="close-btn" onclick="closeTerminal()">KAPAT</button>
        </div>
    </div>
</div>
