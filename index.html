<div id="desktop">
    <div class="icons-container">
        <button class="icon-btn" onclick="openFolder()">
            <span class="emoji">📁</span>
            <span class="label">Notlar.txt</span>
        </button>
        
        <button class="icon-btn" onclick="openTerminal()">
            <span class="emoji">📟</span>
            <span class="label">Terminal</span>
        </button>
        
        <button class="icon-btn" onclick="startFinal()">
            <span class="emoji">⚠️</span>
            <span class="label">SİSTEM.exe</span>
        </button>
    </div>

    <div id="custom-msg" class="hidden terminal-box">
        <div class="title-bar"> [SYSTEM_ALERT] </div>
        <p id="msg-content"></p>
        <button class="action-btn" onclick="closeMsg()"> > DEVAM ET </button>
    </div>

    <div id="loading-box" class="hidden terminal-box">
        <div class="title-bar"> [DECRYPTING_DATA] </div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <div id="terminal-window" class="hidden terminal-box">
        <div class="title-bar"> [ROOT_TERMINAL] </div>
        <input type="text" id="access-code" placeholder="ERİŞİM_KODU_GİRİN..." autocomplete="off">
        <button class="action-btn" onclick="checkCode()"> > EXECUTE </button>
        <div id="terminal-output"></div>
        <button class="close-btn" onclick="closeTerminal()"> [KAPAT] </button>
    </div>
</div>
